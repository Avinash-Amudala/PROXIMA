name: Research checks
on: [push, pull_request]
jobs:
  scientific-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-journal.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: python scripts/reproduce_all.py --repetitions 3 --output-dir /tmp/proxima-smoke
