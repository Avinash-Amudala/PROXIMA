[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxima"
version = "0.1.0"
description = "PROXIMA: Proxy Metric Intelligence for Online Experiments"
readme = "README.md"
authors = [
    {name = "Avinash Amudala", email = "aa9429@g.rit.edu"}
]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "matplotlib>=3.7", "seaborn>=0.12", "statsmodels>=0.14",
  "fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/proxima --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

